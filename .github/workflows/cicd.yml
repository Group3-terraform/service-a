name: Build & Push to ECR

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: 570430250751.dkr.ecr.ap-southeast-1.amazonaws.com
  SERVICE_NAME: service-a

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # Detect dev / uat / prod based on branch where tag created
      # ---------------------------------------------------------
      - name: Detect Environment From Branch
        run: |
          BRANCH=$(git branch -r --contains $GITHUB_SHA | head -n 1 | sed 's/origin\///')
          echo "Branch='$BRANCH'"

          if [[ "$BRANCH" == "dev" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          elif [[ "$BRANCH" == "uat" ]]; then
            echo "ENVIRONMENT=uat" >> $GITHUB_ENV
          elif [[ "$BRANCH" == "prod" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          fi

      # ---------------------------------------------------------
      # Extract version from tag (v1.0.6 → v1.0.6)
      # ---------------------------------------------------------
      - name: Extract Version Tag
        run: |
          RAW="${GITHUB_REF#refs/tags/}"
          CLEAN="${RAW,,}"
          echo "VERSION=$CLEAN" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # Configure AWS Credentials
      # ---------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------------------------------
      # Auto-create repository
      # ---------------------------------------------------------
      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names "$SERVICE_NAME" || \
          aws ecr create-repository --repository-name "$SERVICE_NAME" --region $AWS_REGION

      # ---------------------------------------------------------
      # Docker Login
      # ---------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: 'true'

      # ---------------------------------------------------------
      # Build Image
      # ---------------------------------------------------------
      - name: Build Docker Image
        run: docker build -t $SERVICE_NAME .

      # ---------------------------------------------------------
      # Tag ONLY env-version (dev-v1.0.6)
      # ---------------------------------------------------------
      - name: Tag Docker Image
        run: |
          VERSION=${{ env.VERSION }}
          ENVIRONMENT=${{ env.ENVIRONMENT }}
          
          FINAL_TAG="${ENVIRONMENT}-${VERSION}"

          echo "Pushing image tag: $FINAL_TAG"

          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG

      # ---------------------------------------------------------
      # Push ONLY that tag
      # ---------------------------------------------------------
      - name: Push Image to ECR
        run: |
          VERSION=${{ env.VERSION }}
          ENVIRONMENT=${{ env.ENVIRONMENT }}
          FINAL_TAG="${ENVIRONMENT}-${VERSION}"

          docker push $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG

      - name: Done
        run: echo "🚀 Successfully pushed $SERVICE_NAME:$FINAL_TAG"
