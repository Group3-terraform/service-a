name: Build & Push to ECR

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: 570430250751.dkr.ecr.ap-southeast-1.amazonaws.com

  # 👇 CHANGE these depending on repo
  SERVICE_NAME: service-a
  SERVICE_FOLDER: service-a

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ----------------------------------------
      # Detect ENV from branch containing the tag
      # ----------------------------------------
      - name: Detect Environment From Branch
        run: |
          echo "Detecting branch for commit: $GITHUB_SHA"

          RAW=$(git branch -r --contains $GITHUB_SHA | head -n 1)
          CLEAN=$(echo "$RAW" | sed 's/origin\///' | xargs)

          echo "Raw branch = '$RAW'"
          echo "Cleaned branch = '$CLEAN'"

          if [[ "$CLEAN" == "dev" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          elif [[ "$CLEAN" == "uat" ]]; then
            echo "ENVIRONMENT=uat" >> $GITHUB_ENV
          elif [[ "$CLEAN" == "main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          fi

      # ----------------------------------------
      # Extract tag version (v1.0.0)
      # ----------------------------------------
      - name: Extract Version Tag
        run: |
          RAW="${GITHUB_REF#refs/tags/}"
          CLEAN="${RAW,,}"
          echo "VERSION=$CLEAN" >> $GITHUB_ENV
          echo "Detected version: $CLEAN"

      # ----------------------------------------
      # Configure AWS
      # ----------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------
      # Ensure ECR Repo exists
      # ----------------------------------------
      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names "$SERVICE_NAME" \
            || aws ecr create-repository --repository-name "$SERVICE_NAME"

      # ----------------------------------------
      # Docker Login
      # ----------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # ----------------------------------------
      # Build Docker Image (FIXED PATH)
      # ----------------------------------------
      - name: Build Docker Image
        run: |
          echo "Building Docker image from folder: $SERVICE_FOLDER"
          docker build -t $SERVICE_NAME $SERVICE_FOLDER

      # ----------------------------------------
      # Tag Docker Image
      # ----------------------------------------
      - name: Tag Docker Image
        run: |
          FINAL_TAG="${ENVIRONMENT}-${VERSION}"
          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_ENV

          echo "Tagging: $SERVICE_NAME:latest → $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG"
          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG

      # ----------------------------------------
      # Push Image to ECR
      # ----------------------------------------
      - name: Push Image to ECR
        run: |
          echo "Pushing: $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG"
          docker push $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG

      # ----------------------------------------
      # Finish
      # ----------------------------------------
      - name: Done
        run: |
          echo "🚀 Successfully pushed image:"
          echo "$ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG"
