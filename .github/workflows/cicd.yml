name: Build & Push to ECR

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 570430250751.dkr.ecr.ap-southeast-1.amazonaws.com
  SERVICE_NAME: service-a   # CHANGE THIS ONLY

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      #####################################################
      # Auto-detect which branch the tag comes from
      #####################################################
      - name: Detect Environment From Branch
        id: detect-env
        run: |
          BRANCH=$(git branch -r --contains $GITHUB_SHA | head -n 1 | sed 's/origin\///')

          echo "Detected branch: $BRANCH"

          if [[ "$BRANCH" == "dev" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          elif [[ "$BRANCH" == "uat" ]]; then
            echo "ENVIRONMENT=uat" >> $GITHUB_ENV
          elif [[ "$BRANCH" == "prod" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          fi

      #####################################################
      # Extract Version From Tag
      #####################################################
      - name: Extract & Sanitize Version
        run: |
          RAW="${GITHUB_REF#refs/tags/}"

          SAFE="${RAW//\//-}"
          SAFE="${SAFE//+/-}"
          SAFE="${SAFE// /-}"
          SAFE="${SAFE,,}"

          echo "VERSION=$SAFE" >> $GITHUB_ENV

      #####################################################
      # Configure AWS Credentials
      #####################################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::570430250751:role/github-oidc-service-a-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      #####################################################
      # Build Docker
      #####################################################
      - name: Build Docker Image
        run: docker build -t $SERVICE_NAME .

      #####################################################
      # Tag Docker (version, env-version, sha)
      #####################################################
      - name: Tag Docker Image
        run: |
          SHA=${{ github.sha }}
          VERSION=${{ env.VERSION }}
          ENVIRONMENT=${{ env.ENVIRONMENT }}

          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$SERVICE_NAME:latest
          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$SERVICE_NAME:$VERSION
          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$SERVICE_NAME:${ENVIRONMENT}-${VERSION}
          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$SERVICE_NAME:$SHA

      #####################################################
      # Push Images
      #####################################################
      - name: Push Images to ECR
        run: |
          SHA=${{ github.sha }}
          VERSION=${{ env.VERSION }}
          ENVIRONMENT=${{ env.ENVIRONMENT }}

          docker push $ECR_REGISTRY/$SERVICE_NAME:latest
          docker push $ECR_REGISTRY/$SERVICE_NAME:$VERSION
          docker push $ECR_REGISTRY/$SERVICE_NAME:${ENVIRONMENT}-${VERSION}
          docker push $ECR_REGISTRY/$SERVICE_NAME:$SHA

      - name: Complete
        run: echo "✔ Build & Push completed successfully!"
