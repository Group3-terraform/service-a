name: Build & Push to ECR

on:
  push:
    tags:
      - "v*.*.*"
      - "deploy-*"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: 570430250751.dkr.ecr.ap-southeast-1.amazonaws.com
  SERVICE_NAME: service-a

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      #######################################################
      # CHECKOUT CODE
      #######################################################
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      #######################################################
      # DETECT ENVIRONMENT FROM BRANCH
      #######################################################
      - name: Detect Environment From Branch
        run: |
          RAW=$(git branch -r --contains $GITHUB_SHA | head -n 1)
          CLEAN=$(echo "$RAW" | sed 's/origin\///' | xargs)

          if [[ "$CLEAN" == "dev" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          elif [[ "$CLEAN" == "uat" ]]; then
            echo "ENVIRONMENT=uat" >> $GITHUB_ENV
          elif [[ "$CLEAN" == "main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          fi

      #######################################################
      # EXTRACT VERSION TAG (clean)
      # deploy-v1.0.12 → v1.0.12
      #######################################################
      - name: Extract Version Tag
        run: |
          RAW="${GITHUB_REF#refs/tags/}"

          # Remove deploy- prefix if exists
          if [[ "$RAW" == deploy-* ]]; then
            CLEAN="${RAW#deploy-}"
          else
            CLEAN="$RAW"
          fi

          echo "VERSION=${CLEAN,,}" >> $GITHUB_ENV
          echo "Final VERSION = ${CLEAN,,}"

      #######################################################
      # AWS AUTH
      #######################################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names "$SERVICE_NAME" \
            || aws ecr create-repository --repository-name "$SERVICE_NAME"

      #######################################################
      # LOGIN TO ECR
      #######################################################
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      #######################################################
      # DOCKER BUILD (ROOT OF REPO)
      #######################################################
      - name: Build Docker Image
        run: |
          echo "📦 Building Docker image from repo root"
          docker build -t $SERVICE_NAME .

      #######################################################
      # TAG & PUSH IMAGE
      #######################################################
      - name: Tag Docker Image
        run: |
          FINAL_TAG="${ENVIRONMENT}-${VERSION}"
          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_ENV

          echo "Tagging image as: $FINAL_TAG"
          docker tag $SERVICE_NAME:latest \
            $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG

      - name: Push Image to ECR
        run: |
          echo "Pushing image: $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG"
          docker push $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG

      - name: Done
        run: echo "🚀 Successfully pushed $SERVICE_NAME:$FINAL_TAG"
