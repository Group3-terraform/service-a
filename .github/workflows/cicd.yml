name: Build & Push to ECR

on:
  push:
    tags:
      - "v*.*.*"
      - "deploy-*"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: 570430250751.dkr.ecr.ap-southeast-1.amazonaws.com
  SERVICE_NAME: service-a    # ← change only per repo

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ------------------------------
      # Detect environment from branch
      # ------------------------------
      - name: Detect Environment From Branch
        run: |
          RAW=$(git branch -r --contains $GITHUB_SHA | head -n 1)
          CLEAN=$(echo "$RAW" | sed 's/origin\///' | xargs)

          if [[ "$CLEAN" == "dev" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          elif [[ "$CLEAN" == "uat" ]]; then
            echo "ENVIRONMENT=uat" >> $GITHUB_ENV
          elif [[ "$CLEAN" == "main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          fi

      # ------------------------------
      # Extract version tag
      # ------------------------------
      - name: Extract Version Tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${TAG,,}" >> $GITHUB_ENV

      # ------------------------------
      # AWS Credentials
      # ------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names "$SERVICE_NAME" \
            || aws ecr create-repository --repository-name "$SERVICE_NAME"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # ------------------------------
      # Build Docker Image (ROOT PATH)
      # ------------------------------
      - name: Build Docker Image
        run: |
          echo "📦 Building Docker image from repo root"
          docker build -t $SERVICE_NAME .

      # ------------------------------
      # Tag & Push
      # ------------------------------
      - name: Tag Docker Image
        run: |
          FINAL_TAG="${ENVIRONMENT}-${VERSION}"
          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_ENV
          docker tag $SERVICE_NAME:latest \
            $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG

      - name: Push Image to ECR
        run: docker push $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG

      - name: Done
        run: echo "🚀 Successfully pushed $SERVICE_NAME:$FINAL_TAG"
