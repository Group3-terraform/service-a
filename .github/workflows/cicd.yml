name: Build & Push to ECR - Service A

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: 570430250751.dkr.ecr.ap-southeast-1.amazonaws.com
  SERVICE_NAME: service-a
  SERVICE_PATH: service-a  # folder name

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout Repository
      # ---------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v3

      # ---------------------------------------------------------
      # Detect Environment From Branch
      # ---------------------------------------------------------
      - name: Detect Environment From Branch
        run: |
          echo "Detecting branch for commit: $GITHUB_SHA"
          RAW=$(git branch -r --contains $GITHUB_SHA | head -n 1)
          CLEAN=$(echo "$RAW" | sed 's/origin\///' | xargs)

          if [[ "$CLEAN" == "dev" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          elif [[ "$CLEAN" == "uat" ]]; then
            echo "ENVIRONMENT=uat" >> $GITHUB_ENV
          elif [[ "$CLEAN" == "main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          fi

      # ---------------------------------------------------------
      # Extract Version From Tag (v1.0.9 → v1.0.9)
      # ---------------------------------------------------------
      - name: Extract Version Tag
        run: |
          RAW="${GITHUB_REF#refs/tags/}"
          CLEAN="${RAW,,}"
          echo "VERSION=$CLEAN" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # Configure AWS
      # ---------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR Repo Exists
        run: |
          aws ecr describe-repositories --repository-names "$SERVICE_NAME" \
            || aws ecr create-repository --repository-name "$SERVICE_NAME"

      # ---------------------------------------------------------
      # Docker Login
      # ---------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # ---------------------------------------------------------
      # Build Docker Image (FIXED WORKING DIRECTORY)
      # ---------------------------------------------------------
      - name: Build Docker Image
        run: |
          echo "Building inside: ${{ github.workspace }}/$SERVICE_PATH"
          cd ${{ github.workspace }}/$SERVICE_PATH
          docker build -t $SERVICE_NAME .

      # ---------------------------------------------------------
      # Tag & Push Image
      # ---------------------------------------------------------
      - name: Tag Docker Image
        run: |
          FINAL_TAG="${ENVIRONMENT}-${VERSION}"
          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_ENV
          docker tag $SERVICE_NAME:latest \
            $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG

      - name: Push Docker Image
        run: |
          docker push $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG

      - name: Done
        run: echo "🚀 Successfully pushed $SERVICE_NAME:$FINAL_TAG"
