name: Build & Push to ECR

on:
  push:
    tags:
      - "v*.*.*"     # Only run when pushing version tags like v1.0.3
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: 570430250751.dkr.ecr.ap-southeast-1.amazonaws.com
  SERVICE_NAME: service-a   # Change for each microservice

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      ###########################################################
      # Detect ENV (dev/uat/prod) from branch where tag was created
      ###########################################################
      - name: Detect Environment From Branch
        run: |
          BRANCH=$(git branch -r --contains $GITHUB_SHA | head -n 1 | sed 's/origin\///')

          echo "Branch detected = $BRANCH"

          if [[ "$BRANCH" == "dev" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          elif [[ "$BRANCH" == "uat" ]]; then
            echo "ENVIRONMENT=uat" >> $GITHUB_ENV
          elif [[ "$BRANCH" == "prod" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV   # fallback
          fi

      ###########################################################
      # Extract VERSION from tag
      ###########################################################
      - name: Extract Version
        run: |
          RAW="${GITHUB_REF#refs/tags/}"
          CLEAN="${RAW,,}"                 # lowercase
          CLEAN="${CLEAN//\//-}"           # replace slash
          CLEAN="${CLEAN//+/-}"            # replace plus
          CLEAN="${CLEAN// /-}"            # replace spaces

          echo "VERSION=$CLEAN" >> $GITHUB_ENV

      ###########################################################
      # AWS Credentials (Using Secrets)
      ###########################################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ###########################################################
      # Auto-create repository
      ###########################################################
      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names "$SERVICE_NAME" || \
          aws ecr create-repository --repository-name "$SERVICE_NAME" --region $AWS_REGION

      ###########################################################
      # Login to ECR
      ###########################################################
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: 'true'

      ###########################################################
      # Build Image
      ###########################################################
      - name: Build Docker Image
        run: docker build -t $SERVICE_NAME .

      ###########################################################
      # Tag ONLY version + environment-version
      ###########################################################
      - name: Tag Docker Image
        run: |
          VERSION=${{ env.VERSION }}
          ENVIRONMENT=${{ env.ENVIRONMENT }}

          echo "Tagging:"
          echo " - $VERSION"
          echo " - $ENVIRONMENT-$VERSION"

          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$SERVICE_NAME:$VERSION
          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$SERVICE_NAME:${ENVIRONMENT}-${VERSION}

      ###########################################################
      # Push ONLY these 2 images
      ###########################################################
      - name: Push Images
        run: |
          VERSION=${{ env.VERSION }}
          ENVIRONMENT=${{ env.ENVIRONMENT }}

          docker push $ECR_REGISTRY/$SERVICE_NAME:$VERSION
          docker push $ECR_REGISTRY/$SERVICE_NAME:${ENVIRONMENT}-${VERSION}

      - name: Done
        run: echo "🚀 Build & Push completed successfully!"
