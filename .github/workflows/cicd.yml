name: Build & Deploy Service-A

on:
  push:
    tags:
      - "dev-v*.*.*"
      - "uat-v*.*.*"
      - "prod-v*.*.*"
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 570430250751.dkr.ecr.ap-southeast-1.amazonaws.com
  SERVICE_NAME: service-a
  SERVICE_PATH: service-a

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Extract environment from tag
      - name: Extract Environment
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Full Tag: $TAG"

          if [[ "$TAG" == dev-* ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          elif [[ "$TAG" == uat-* ]]; then
            echo "ENVIRONMENT=uat" >> $GITHUB_ENV
          elif [[ "$TAG" == prod-* ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "Unknown tag format!"
            exit 1
          fi

          VERSION=${TAG#*-}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Create repo if does not exist
      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names "$SERVICE_NAME" \
            || aws ecr create-repository --repository-name "$SERVICE_NAME"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # BUILD DOCKER ONLY INSIDE service-a folder
      - name: Build Docker Image
        working-directory: ./service-a
        run: docker build -t $SERVICE_NAME .

      # Tag and Push
      - name: Tag & Push Image
        run: |
          FINAL_TAG="${ENVIRONMENT}-${VERSION}"
          docker tag $SERVICE_NAME:latest \
            $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG
          
          docker push $ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG

          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_ENV

      # --- Deploy to Kubernetes ---
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ap-southeast-1 --name group3-${ENVIRONMENT}-eks

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/${SERVICE_NAME} \
            ${SERVICE_NAME}=$ECR_REGISTRY/$SERVICE_NAME:$FINAL_TAG \
            -n apps

          kubectl rollout status deployment/${SERVICE_NAME} -n apps
