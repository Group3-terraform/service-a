name: Build & Push to ECR

on:
  push:
    tags:
      - "v*.*.*"      # ONLY runs when you push tags like v1.0.1
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: 570430250751.dkr.ecr.ap-southeast-1.amazonaws.com
  SERVICE_NAME: service-a   # 🔁 change to service-b / service-c in other repos

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      #####################################################
      # Detect Environment From Branch (dev / uat / prod)
      #####################################################
      - name: Detect Environment From Branch
        run: |
          BRANCH=$(git branch -r --contains $GITHUB_SHA | head -n 1 | sed 's/origin\///')
          echo "Detected branch: $BRANCH"

          if [[ "$BRANCH" == "dev" ]]; then
            ENVIRONMENT="dev"
          elif [[ "$BRANCH" == "uat" ]]; then
            ENVIRONMENT="uat"
          elif [[ "$BRANCH" == "prod" ]]; then
            ENVIRONMENT="prod"
          else
            ENVIRONMENT="dev" # default if cannot detect
          fi

          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV

      #####################################################
      # Extract Version From Tag & Sanitize
      #####################################################
      - name: Extract & Sanitize Version
        run: |
          RAW="${GITHUB_REF#refs/tags/}"

          SAFE="${RAW//\//-}"
          SAFE="${SAFE//+/-}"
          SAFE="${SAFE// /-}"
          SAFE="${SAFE,,}"

          echo "VERSION=$SAFE" >> $GITHUB_ENV
          echo "Version: $SAFE"

      #####################################################
      # Configure AWS Credentials (using Secrets)
      #####################################################
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      #####################################################
      # Build Docker Image
      #####################################################
      - name: Build Docker Image
        run: |
          docker build -t $SERVICE_NAME .

      #####################################################
      # Tag Docker Image (env + version + sha)
      #####################################################
      - name: Tag Docker Image
        run: |
          SHA=${{ github.sha }}
          VERSION=${{ env.VERSION }}
          ENVIRONMENT=${{ env.ENVIRONMENT }}

          echo "Using ENVIRONMENT=$ENVIRONMENT, VERSION=$VERSION, SHA=$SHA"

          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$SERVICE_NAME:latest
          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$SERVICE_NAME:$VERSION
          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$SERVICE_NAME:${ENVIRONMENT}-${VERSION}
          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$SERVICE_NAME:$SHA

      #####################################################
      # Push Images to ECR
      #####################################################
      - name: Push Images to ECR
        run: |
          VERSION=${{ env.VERSION }}
          ENVIRONMENT=${{ env.ENVIRONMENT }}

          docker push $ECR_REGISTRY/$SERVICE_NAME:latest
          docker push $ECR_REGISTRY/$SERVICE_NAME:$VERSION
          docker push $ECR_REGISTRY/$SERVICE_NAME:${ENVIRONMENT}-${VERSION}
          docker push $ECR_REGISTRY/$SERVICE_NAME:${{ github.sha }}

      - name: Complete
        run: echo "✅ Build & Push completed successfully!"
