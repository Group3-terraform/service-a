apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: apps
  labels:
    app: service-a

spec:
  selector:
    matchLabels:
      app: service-a

  template:
    metadata:
      labels:
        app: service-a

    spec:
      containers:
      - name: service-a
        image: 570430250751.dkr.ecr.ap-southeast-1.amazonaws.com/service-a:dev-v1.0.22
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /a/health
            port: 8080
        livenessProbe:
          httpGet:
            path: /a/health
            port: 8080
