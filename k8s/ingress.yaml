apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  namespace: apps
  annotations:
    # Tell k8s to use AWS ALB Ingress Controller
    kubernetes.io/ingress.class: alb

    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: group3-dev-alb

    # HTTPS + HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"

    # ACM cert
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:570430250751:certificate/e3d665c9-81cb-45fa-a99e-c1348e3810d7

    # HEALTH CHECK – this must match a real path in FastAPI
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"

spec:
  ingressClassName: alb
  rules:
    - host: api.dev.theareak.click
      http:
        paths:
          - path: /a
            pathType: Prefix
            backend:
              service:
                name: service-a
                port:
                  number: 8080

          # You can keep these for future services (but ALB will show unhealthy for them
          # until service-b and service-c exist with working endpoints)
          - path: /b
            pathType: Prefix
            backend:
              service:
                name: service-b
                port:
                  number: 8080
          - path: /c
            pathType: Prefix
            backend:
              service:
                name: service-c
                port:
                  number: 8080
